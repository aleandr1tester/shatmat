[package]
name = "shatmat"
version = "0.21.1"
edition = "2021"
description = "ShatMat — фигуры меняют природу"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
puremp3 = "0.1"
resvg = { version = "0.50", default-features = false, features = ["text", "raster-images"] }
# Noise_XX: чистый Rust без ring — иначе сборка требует gcc, которого нет.
snow = { version = "0.10", default-features = false, features = ["use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom"] }
socket2 = "0.5"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
