[package]
name = "shatmat"
version = "0.7.0"
edition = "2021"
description = "Сумерки — гибрид шахмат и шашек"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
